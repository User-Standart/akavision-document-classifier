name: Frontend CI

on:
  pull_request:
    branches: [main, develop]
    paths: ['API-6SEM-FRONTEND/**', '.github/workflows/frontend-ci.yml']
  push:
    branches: [main, develop]
    paths: ['API-6SEM-FRONTEND/**', '.github/workflows/frontend-ci.yml']

defaults:
  run:
    working-directory: API-6SEM-FRONTEND

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Lint (ESLint)
        run: npx eslint .

      - name: Format check (Prettier)
        run: npx prettier --check "**/*.{js,vue,json,css,md}"

  build:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build
