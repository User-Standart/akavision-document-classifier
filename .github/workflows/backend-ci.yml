name: Backend CI

on:
  pull_request:
    branches: [main, develop]
    paths: ['API-6SEM-BACKEND/**', '.github/workflows/backend-ci.yml']
  push:
    branches: [main, develop]
    paths: ['API-6SEM-BACKEND/**', '.github/workflows/backend-ci.yml']

defaults:
  run:
    working-directory: API-6SEM-BACKEND

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Ruff
        run: pip install ruff==0.16.8

      - name: Lint (Ruff)
        run: ruff check .

      - name: Format check (Ruff)
        run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      # - run: python manage.py test
      #   TODO: enable once the first tests are written (login/RAG)
